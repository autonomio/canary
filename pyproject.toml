[project]
name = "canary"
version = "0.1.0"
description = "API-first full-paper research with traceable findings and independent audits."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pypdf==6.19.0",
    "pyyaml>=6.0",
    "mcp>=1.16,<2",
]

[project.scripts]
canary = "canary.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.18",
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canary"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/dashboard" = "canary/_resources/scripts/dashboard"
"scripts/coverage_run.sh" = "canary/_resources/scripts/coverage_run.sh"
"uv.lock" = "canary/_resources/uv.lock"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live and not containment' --strict-markers"
markers = [
    "live: requires live provider credentials and network (opt-in only)",
    "containment: requires docker or host containment checks (opt-in only)",
]
